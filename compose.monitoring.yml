---
services:
  prometheus:
    image: docker.io/prom/prometheus:v2.42.0
    volumes:
      - ./monitoring_example/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    networks:
      - backend
    restart: unless-stopped

  grafana:
    image: docker.io/grafana/grafana:8.2.6
    depends_on:
      - prometheus
    ports:
      - 3000:3000
    volumes:
      - ./monitoring_example/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources
      - ./monitoring_example/grafana/main.yml:/etc/grafana/provisioning/dashboards/main.yml
      - ./monitoring_example/grafana/dashboards:/var/lib/grafana/dashboards
    networks:
      - backend
    restart: unless-stopped
    environment:
      GF_SECURITY_DISABLE_INITIAL_ADMIN_CREATION: "true"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Admin"
      GF_AUTH_DISABLE_SIGNOUT_MENU: "true"
      GF_AUTH_DISABLE_LOGIN_FORM: "true"

  # OpenTelemetry Collector: receives OTLP telemetry from apps and fans it
  # out to backends (traces -> Jaeger). It also scrapes Tiled's Prometheus
  # metrics endpoint and re-exposes it for Prometheus. Apps on the 'backend'
  # network export to http://otel-collector:4318; apps on the host export to
  # http://localhost:4318.
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.130.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./monitoring_example/otel-collector/otel-collector.yml:/etc/otelcol/config.yaml
    ports:
      - 4317:4317   # OTLP gRPC
      - 4318:4318   # OTLP HTTP
      - 8889:8889   # Prometheus exporter (re-exposed scraped metrics)
    depends_on:
      - jaeger
    networks:
      - backend
    restart: unless-stopped

  # Jaeger all-in-one: trace storage + query UI. In-memory storage (dev
  # only; traces are lost on restart). Natively accepts OTLP.
  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - 16686:16686   # Jaeger web UI
    networks:
      - backend
    restart: unless-stopped

networks:
  backend: {}

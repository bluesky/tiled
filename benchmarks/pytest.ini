# Configuration for the benchmark suite. Run it with:
#
#     pytest -c benchmarks/pytest.ini
#
# It is separate from the test suite's `pytest.ini`: benchmarks are collected
# from `bench_*` functions, and they run in a single process (no xdist), since
# concurrent processes would disturb the timings. Every benchmark gets one
# untimed warm-up round, so that one-time costs (first connection to a
# storage, first use of a library) do not count. The table groups the results
# by the `group` marker that each file sets; the ratios in parentheses are relative to the fastest benchmark of
# the group.
[pytest]
testpaths = .
pythonpath = ..
python_files = bench_*.py
python_functions = bench_*
addopts =
    -p tests._httpx2_pytest_bootstrap
    --benchmark-sort=name
    --benchmark-group-by=group
    --benchmark-time-unit=ms
    --benchmark-columns=min,median,mean,stddev,max,rounds
    --benchmark-min-rounds=5
    --benchmark-warmup=on
    --benchmark-warmup-iterations=1
    --benchmark-disable-gc
asyncio_mode = auto
